name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bez uprawnień do zapisu — CI tylko sprawdza.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rdzeń Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatowanie
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Testy
        run: cargo test --all-features

      # Rdzeń musi budować się pod WASM, bo tego samego kodu używa klient
      # webowy. Sprawdzamy to na każdym PR, żeby nie odkryć problemu dopiero
      # przy integracji przeglądarki.
      - name: Build pod wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mekamb-core --target wasm32-unknown-unknown

  audit:
    name: Audyt zależności
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
