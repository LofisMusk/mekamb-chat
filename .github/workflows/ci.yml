name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bez uprawnień do zapisu — CI tylko sprawdza.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rdzeń Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatowanie
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Testy
        run: cargo test --all-features

      # Rdzeń musi budować się pod WASM, bo tego samego kodu używa klient
      # webowy. Sprawdzamy to na każdym PR, żeby nie odkryć problemu dopiero
      # przy integracji przeglądarki.
      #
      # Rdzeń nie potrzebuje do tego żadnego toolchainu C — to celowe, patrz
      # komentarz w transport/Cargo.toml.
      - name: Rdzeń pod wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mekamb-core --target wasm32-unknown-unknown

      # Transportu NIE sprawdzamy pod wasm32 i to jest zamierzone: opiera się
      # na gniazdach UDP, których w przeglądarce nie ma. Klient webowy w ogóle
      # go nie używa — korzysta ze skrzynki na serwerze.
      #
      # Rdzeń kryptograficzny pozostaje przenośny i to on jest tu sprawdzany.

  server:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Testy działają na workerd — tym samym silniku co produkcja, więc
      # gwarancje Durable Objects są sprawdzane realnie, a nie na atrapie.
      - name: Testy
        run: npm test

  web:
    name: Klient webowy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - run: npm ci

      # `build` buduje WASM, sprawdza typy i pakuje aplikację — jeśli przejdzie,
      # klient da się wdrożyć.
      - name: Build
        run: npm run build

  audit:
    name: Audyt zależności
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Rust
        uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      # Zależności JavaScriptu też mają podatności, a serwer i klient webowy
      # opierają się na nich tak samo jak rdzeń na crate'ach.
      #
      # BLOKUJE tylko to, co trafia do użytkownika (`--omit=dev`). Narzędzia
      # budowania i testów sprawdzamy osobno, informacyjnie: wrangler i miniflare
      # ciągną `undici` z otwartymi zgłoszeniami, a jedyna „poprawka" oferowana
      # przez npm to cofnięcie wranglera do starszej wersji. Blokowanie każdej
      # zmiany w projekcie z tego powodu byłoby gorsze niż świadome odnotowanie.
      - name: Serwer (zależności produkcyjne)
        working-directory: server
        run: npm ci && npm audit --audit-level=high --omit=dev

      - name: Klient webowy (zależności produkcyjne)
        working-directory: web
        run: npm ci && npm audit --audit-level=high --omit=dev

      - name: Narzędzia budowania (informacyjnie)
        continue-on-error: true
        run: |
          echo "::group::server"; (cd server && npm audit --audit-level=high) || true
          echo "::endgroup::"
          echo "::group::web"; (cd web && npm audit --audit-level=high) || true
          echo "::endgroup::"
