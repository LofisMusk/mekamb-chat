name: CI

on:
  push:
    branches: [main]
  pull_request:

# Bez uprawnień do zapisu — CI tylko sprawdza.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  core:
    name: Rdzeń Rust
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Formatowanie
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets --all-features

      - name: Testy
        run: cargo test --all-features

      # Rdzeń musi budować się pod WASM, bo tego samego kodu używa klient
      # webowy. Sprawdzamy to na każdym PR, żeby nie odkryć problemu dopiero
      # przy integracji przeglądarki.
      #
      # Rdzeń nie potrzebuje do tego żadnego toolchainu C — to celowe, patrz
      # komentarz w transport/Cargo.toml.
      - name: Rdzeń pod wasm32
        run: |
          rustup target add wasm32-unknown-unknown
          cargo check -p mekamb-core --target wasm32-unknown-unknown

      # Transport ciągnie `ring`, który kompiluje kod C i wymaga clanga
      # potrafiącego celować w wasm32. Systemowy clang na macOS tego nie umie,
      # więc ten krok jest sprawdzany wyłącznie tutaj, na Linuksie.
      - name: Transport pod wasm32
        env:
          CC_wasm32_unknown_unknown: clang
          AR_wasm32_unknown_unknown: llvm-ar
        run: cargo check -p mekamb-transport --target wasm32-unknown-unknown

  server:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      # Testy działają na workerd — tym samym silniku co produkcja, więc
      # gwarancje Durable Objects są sprawdzane realnie, a nie na atrapie.
      - name: Testy
        run: npm test

  audit:
    name: Audyt zależności
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
