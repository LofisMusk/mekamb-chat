name: Deploy PWA na GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Jedno wdrożenie naraz. Anulowanie w trakcie zostawiłoby Pages w połowie.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: wasm-pack
        run: |
          rustup target add wasm32-unknown-unknown
          curl -sSf https://rustwasm.github.io/wasm-pack/installer/init.sh | sh

      - run: npm ci
        working-directory: web

      - name: Build
        working-directory: web
        env:
          GITHUB_PAGES: "true"
          VITE_API_URL: ${{ vars.API_URL }}
        run: |
          # Adres backendu trafia do CSP przy budowaniu. Bez niego klient
          # wyszedłby z adresem localhost i po wdrożeniu nie połączyłby się
          # z niczym — a wyglądałby na działający, dopóki ktoś nie spróbuje
          # się zalogować. Lepiej zatrzymać build.
          if [ -z "$VITE_API_URL" ]; then
            echo "::error::Brak zmiennej API_URL."
            echo "Ustaw ją w Settings → Secrets and variables → Actions → Variables"
            echo "na adres wdrożonego Workera, np. https://mekamb.<subdomena>.workers.dev"
            exit 1
          fi
          npm run build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
