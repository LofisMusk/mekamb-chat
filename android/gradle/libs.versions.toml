[versions]
agp = "9.3.1"
kotlin = "2.4.10"
composeBom = "2026.06.01"
coreKtx = "1.17.0"
lifecycle = "2.9.4"
activityCompose = "1.11.0"
# UniFFI ładuje bibliotekę natywną przez JNA — to wymóg wygenerowanego kodu,
# nie nasz wybór. Wariant "@aar" zawiera natywne części dla Androida.
jna = "5.19.1"
coroutines = "1.10.2"
securityCrypto = "1.1.0"
# CameraX do podglądu i analizy klatek przy parowaniu. Aparat obsługuje już
# WebRTC (Camera2Enumerator), ale wyłącznie na potrzeby rozmowy A/V — surowych
# klatek do dekodowania nie wystawia, a pisanie własnej ścieżki Camera2 to
# kilkaset linii kodu, w którym błąd objawia się czarnym podglądem na jednym
# modelu telefonu.
camerax = "1.5.0"
# Dekoder QR. ZXing core, nie ML Kit: ML Kit w wersji wbudowanej dokłada ~2,5 MB
# do 5,4 MB wydania, a w wersji odchudzonej wymaga Usług Google Play — czyli
# odcina telefony bez nich, co przy aplikacji o tym profilu jest złym
# kompromisem. ZXing to czysta Java, bez zależności od Google.
zxing = "3.5.3"
okhttp = "5.2.1"
serialization = "1.9.0"
junit = "4.13.2"
# WebRTC dla Androida. Oficjalne artefakty Google nie są publikowane od 2018 r.;
# webrtc-sdk to utrzymywana kompilacja tego samego drzewa (przestrzeń nazw
# `org.webrtc`), z której korzysta większość klientów natywnych.
webrtc = "125.6422.07"

[libraries]
androidx-camera-camera2 = { module = "androidx.camera:camera-camera2", version.ref = "camerax" }
androidx-camera-lifecycle = { module = "androidx.camera:camera-lifecycle", version.ref = "camerax" }
androidx-camera-view = { module = "androidx.camera:camera-view", version.ref = "camerax" }
zxing-core = { module = "com.google.zxing:core", version.ref = "zxing" }
androidx-core-ktx = { module = "androidx.core:core-ktx", version.ref = "coreKtx" }
androidx-lifecycle-runtime-ktx = { module = "androidx.lifecycle:lifecycle-runtime-ktx", version.ref = "lifecycle" }
androidx-lifecycle-viewmodel-compose = { module = "androidx.lifecycle:lifecycle-viewmodel-compose", version.ref = "lifecycle" }
androidx-activity-compose = { module = "androidx.activity:activity-compose", version.ref = "activityCompose" }
androidx-compose-bom = { module = "androidx.compose:compose-bom", version.ref = "composeBom" }
androidx-compose-material3 = { module = "androidx.compose.material3:material3" }
androidx-compose-ui = { module = "androidx.compose.ui:ui" }
androidx-compose-ui-tooling-preview = { module = "androidx.compose.ui:ui-tooling-preview" }
androidx-compose-ui-tooling = { module = "androidx.compose.ui:ui-tooling" }
androidx-security-crypto = { module = "androidx.security:security-crypto", version.ref = "securityCrypto" }
jna = { module = "net.java.dev.jna:jna", version.ref = "jna" }
kotlinx-coroutines-android = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-android", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
okhttp = { module = "com.squareup.okhttp3:okhttp", version.ref = "okhttp" }
junit = { module = "junit:junit", version.ref = "junit" }
webrtc = { module = "io.github.webrtc-sdk:android", version.ref = "webrtc" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
kotlin-compose = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
