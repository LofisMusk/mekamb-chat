[package]
name = "mekamb-wasm"
description = "Bindingi WebAssembly rdzenia mekamb-chat dla klienta przeglądarkowego"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
mekamb-core = { path = "../.." }

# Klient OPAQUE jedzie razem z MLS, żeby przeglądarka ładowała jeden moduł
# zamiast dwóch.
mekamb-opaque = { path = "../../../opaque" }
wasm-bindgen = "0.2"

# Bez tego panika w Rust objawia się w przeglądarce jako `unreachable executed`
# bez śladu, skąd przyszła.
console_error_panic_hook = "0.1"

# Patrz opaque/bindings/wasm/Cargo.toml — getrandom 0.2 potrzebuje na wasm32
# jawnego wskazania źródła losowości.
[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2", features = ["js"] }

# wasm-opt pobiera binarkę binaryen z sieci przy każdym buildzie. Wyłączamy go,
# żeby build był powtarzalny, działał offline i nie wymagał dodatkowego kroku w CI.
#
# Koszt: pakiet jest większy, niż mógłby być (obecnie ~1,3 MB, ~445 KB po gzip).
# Kto chce mniejszy artefakt, instaluje binaryen lokalnie i przestawia tę flagę.
[package.metadata.wasm-pack.profile.release]
wasm-opt = false
