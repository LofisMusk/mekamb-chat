# Projekt Xcode klienta iOS — źródło prawdy dla `Mekamb.xcodeproj`.
#
#     cd ios && xcodegen generate
#
# # Dlaczego xcodegen, a nie zacommitowany sam .xcodeproj
#
# Plik `project.pbxproj` jest nieczytelny przy przeglądzie zmian i konfliktuje
# przy każdym dodanym pliku. Ten plik mówi to samo w kilkudziesięciu liniach.
# Wygenerowany projekt i tak jest w repozytorium, żeby dało się otworzyć
# aplikację w Xcode bez instalowania czegokolwiek.

name: Mekamb

options:
  bundleIdPrefix: com.mekamb
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  developmentLanguage: pl

# WebRTC dla rozmów A/V — gotowe binarne XCFramework z oficjalnego kodu Google.
#
# # Dlaczego paczka binarna, a nie budowanie WebRTC u siebie
#
# Budowa WebRTC to depot_tools, gn, ninja i godzina kompilacji na każdej
# maszynie. Ta sama biblioteka co na Androidzie (`org.webrtc`) — tylko
# zbudowana raz. Wersja przypięta dokładnie: aktualizacja ma być decyzją,
# nie skutkiem ubocznym `xcodegen generate`.
packages:
  WebRTC:
    url: https://github.com/stasel/WebRTC
    exactVersion: 157.0.0

settings:
  base:
    SWIFT_VERSION: "6.0"
    # Rdzeń Rust jest zbudowany tylko dla arm64 — symulator na Apple Silicon
    # i telefony. Mac z Intelem nie jest celem tego projektu.
    ARCHS: arm64

targets:
  Mekamb:
    type: application
    platform: iOS
    sources:
      - path: Mekamb
      # Wiązania UniFFI — generuje je `skrypty/zbuduj-rdzen.sh` przed kompilacją.
      - path: Wygenerowane
        optional: true
        createIntermediateGroups: true
    dependencies:
      - framework: Rdzen/MekambFFI.xcframework
        embed: false
      - package: WebRTC
    preBuildScripts:
      # Ten sam układ co na Androidzie: build aplikacji buduje rdzeń. cargo
      # buforuje kompilację, a skrypt składa XCFramework tylko po zmianie Rusta.
      - name: Rdzeń Rust (cargo + UniFFI)
        script: '"${SRCROOT}/skrypty/zbuduj-rdzen.sh"'
        basedOnDependencyAnalysis: false
        outputFiles:
          - $(SRCROOT)/Wygenerowane/mekamb_ffi.swift
    postCompileScripts:
      # ATS: lokalny backend (`wrangler dev`) mówi zwykłym HTTP. Wyjątek
      # dopisujemy WYŁĄCZNIE w Debug i dopiero do zbudowanego Info.plist — plik
      # źródłowy nie ma go wcale, więc wydanie nie może go odziedziczyć przez
      # przeoczenie.
      - name: ATS dla lokalnego backendu (tylko Debug)
        script: |
          if [ "${CONFIGURATION}" = "Debug" ]; then
            PLIST="${TARGET_BUILD_DIR}/${INFOPLIST_PATH}"
            /usr/libexec/PlistBuddy -c "Delete :NSAppTransportSecurity" "$PLIST" 2>/dev/null || true
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity dict" "$PLIST"
            /usr/libexec/PlistBuddy -c "Add :NSAppTransportSecurity:NSAllowsLocalNetworking bool true" "$PLIST"
          fi
        basedOnDependencyAnalysis: false
    info:
      path: Mekamb/Info.plist
      properties:
        CFBundleDisplayName: Mekamb
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        CFBundleDevelopmentRegion: pl
        CFBundleLocalizations: [pl, en]
        # Adres backendu z ustawienia builda — patrz MEKAMB_ADRES_API niżej.
        MekambAdresApi: $(MEKAMB_ADRES_API)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        # Rozmowy A/V. Opis mówi, DOKĄD trafia dźwięk i obraz — to jest
        # pytanie, które ktoś zadaje, widząc prośbę o mikrofon w komunikatorze.
        NSMicrophoneUsageDescription: "Mikrofon jest potrzebny do rozmów głosowych i wideo. Dźwięk idzie zaszyfrowany wprost do rozmówcy."
        NSCameraUsageDescription: "Aparat jest potrzebny do rozmów wideo. Obraz idzie zaszyfrowany wprost do rozmówcy."
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekamb.chat
        PRODUCT_NAME: Mekamb
        TARGETED_DEVICE_FAMILY: "1"
        # Faza budująca rdzeń sięga poza katalog projektu (cargo, target/).
        ENABLE_USER_SCRIPT_SANDBOXING: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: ""
        # Biblioteka statyczna z Rusta wciąga Security (losowość systemowa)
        # i SystemConfiguration (wyliczanie interfejsów sieciowych transportu).
        OTHER_LDFLAGS: ["-framework", "Security", "-framework", "SystemConfiguration"]
      configs:
        # Symulator widzi localhost hosta, więc Debug idzie prosto do
        # `wrangler dev`. Nadpisanie: `xcodebuild MEKAMB_ADRES_API=https://…`.
        Debug:
          MEKAMB_ADRES_API: http://localhost:8787
        # Wydanie NIE ma domyślnego serwera produkcyjnego wpisanego w repo —
        # tak samo jak Android dostaje go przez -PapiUrl w workflow wydania.
        Release:
          MEKAMB_ADRES_API: https://mekamb.invalid

  MekambTesty:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MekambTesty
    dependencies:
      - target: Mekamb
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mekamb.chat.testy
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Mekamb.app/Mekamb
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Mekamb:
    build:
      targets:
        Mekamb: all
        MekambTesty: [test]
    test:
      targets:
        - MekambTesty
    run:
      config: Debug
