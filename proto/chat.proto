// Normatywny opis formatu ładunku aplikacyjnego mekamb-chat.
//
// UWAGA: struktury w `core/src/framing.rs` są deklarowane bezpośrednio w Rust
// (atrybuty `prost`), a nie generowane z tego pliku. Powód: `protoc` byłby
// dodatkową zależnością toolchainu w CI Androida i WASM. Ten plik jest źródłem
// prawdy dla implementacji w innych językach — każda zmiana tutaj musi zostać
// odzwierciedlona w `framing.rs`, i odwrotnie. Test `framing::tests` pilnuje
// zgodności numerów pól.
//
// Ten ładunek jest ZAWSZE przenoszony wewnątrz wiadomości aplikacyjnej MLS.
// Nigdy nie trafia do sieci w postaci jawnej.

syntax = "proto3";

package mekamb.chat.v1;

// ---------------------------------------------------------------------------
// Koperta transportowa — na zewnątrz szyfrowania MLS.
//
// WERSJA 2 nie niesie identyfikatora rozmowy. Wersja 1 niosła go jawnie, a to
// wystarczało serwerowi, żeby zbudować graf rozmów z samego ruchu: dwie koperty
// z tym samym `group_id` znaczyły „to ta sama rozmowa".
//
// Zamiast identyfikatora jedzie losowa SÓL i wyprowadzony z niej ZNACZNIK:
//
//   klucz    = HKDF(group_id, "mekamb-chat/v1/koperta-routing")
//   znacznik = HKDF(salt = sól, ikm = klucz, "mekamb-chat/v1/koperta-znacznik")
//
// Sól jest inna dla każdej koperty, więc znacznik też — dwie koperty tej samej
// rozmowy są dla serwera nie do powiązania. Odbiorca liczy znacznik dla każdej
// swojej rozmowy i porównuje.
//
// `group_id` nie może więc trafić do serwera żadną inną drogą. Dlatego obiekt
// porządkujący epoki nazywa się osobno wyprowadzonym
// HKDF(group_id, "mekamb-chat/v1/relay"), a nie surowym identyfikatorem.
//
// Implementacja: core/src/envelope.rs. Patrz docs/THREAT_MODEL.md.
// ---------------------------------------------------------------------------

message Envelope {
  uint32 version = 1;

  // Losowa sól tej koperty, 16 bajtów.
  bytes sol = 2;

  enum Kind {
    KIND_UNSPECIFIED = 0;
    APPLICATION = 1;  // może iść bezpośrednio P2P
    COMMIT = 2;       // wymaga kolejności z GroupRelay
    WELCOME = 3;      // dla nowo dodanego członka
  }
  Kind kind = 3;

  // Zserializowana wiadomość MLS. Nieczytelna poza grupą.
  bytes payload = 4;

  // Znacznik rozmowy, 16 bajtów. PUSTY dla WELCOME: odbiorca nie zna jeszcze
  // rozmowy, więc nie ma czym dopasowywać — musi spróbować przetworzyć
  // zaproszenie. Brak znacznika przy każdym innym rodzaju jest odrzucany.
  bytes znacznik = 5;
}

// ---------------------------------------------------------------------------
// Poniżej: ładunek WEWNĄTRZ szyfrowania MLS.
// ---------------------------------------------------------------------------

// Wiadomość widziana przez użytkownika.
message ChatMessage {
  // Wersja protokołu ładunku. Odbiorca odrzuca nieznane wersje główne.
  uint32 protocol_version = 1;

  // 16 losowych bajtów. Służy do deduplikacji i do wiązania odpowiedzi.
  // Generowany przez nadawcę, więc NIE jest zaufany globalnie — traktować
  // jako unikalny wyłącznie w obrębie danej rozmowy.
  bytes message_id = 2;

  // Czas wysłania wg zegara nadawcy, w milisekundach epoki uniksowej.
  // To DEKLARACJA NADAWCY, nie fakt: nadawca może wpisać dowolną wartość.
  // Do porządkowania w UI używać kolejności odbioru, a znacznika tylko do
  // wyświetlenia.
  uint64 sent_at_ms = 3;

  oneof body {
    TextBody text = 4;
    AttachmentBody attachment = 5;
    CallSignalBody call_signal = 6;
    ReceiptBody receipt = 8;
  }

  // message_id wiadomości, na którą to jest odpowiedź.
  optional bytes reply_to = 7;
}

message TextBody {
  string content = 1;
}

// Metadane załącznika. Sam plik leży zaszyfrowany w R2 albo leci przez iroh;
// klucz podróżuje tutaj, czyli wewnątrz kanału MLS.
message AttachmentBody {
  string blob_id = 1;
  bytes decryption_key = 2;   // AES-256-GCM, 32 bajty
  bytes nonce = 3;            // 12 bajtów
  string mime_type = 4;
  uint64 size_bytes = 5;
  optional string file_name = 6;
}

// Potwierdzenie dostarczenia albo odczytu.
//
// Idzie kanałem MLS jak każda inna wiadomość aplikacyjna, więc serwer widzi
// wyłącznie szyfrogram — nie wie, kto co odebrał ani kiedy przeczytał.
//
// CZEGO TO NIE UKRYWA: samego faktu, że w danej chwili poszła koperta.
// Potwierdzenie wysłane natychmiast po odczycie jest odczytywalne z ruchu:
// „urządzenie B nadało coś kilka sekund po wiadomości od A". Dlatego klienty
// zbierają potwierdzenia i wysyłają je paczką po losowym opóźnieniu — patrz
// `web/src/lib/potwierdzenia.ts` i `android/.../Potwierdzenia.kt`.
//
// Nie ma tu znacznika czasu. Chwila odczytu jest dokładnie tą informacją,
// której nie chcemy oddawać, a nadawcy wystarczy „przeczytane" — moment
// wpisany przez nadawcę potwierdzenia i tak byłby deklaracją, nie faktem.
message ReceiptBody {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    DELIVERED = 1;  // koperta dotarła i została przetworzona
    READ = 2;       // rozmowa była otwarta na ekranie
  }
  Kind kind = 1;

  // message_id wiadomości, których dotyczy. Paczka, nie pojedyncze
  // potwierdzenie: jedna koperta na wiele wiadomości ujawnia mniej niż
  // koperta na każdą z osobna.
  repeated bytes message_ids = 2;
}

// Sygnalizacja WebRTC przenoszona kanałem MLS.
//
// Dzięki temu odcisk DTLS jest uwierzytelniony kryptograficznie: nawet podmiot
// kontrolujący warstwę transportową nie podstawi się w środek połączenia, bo
// nie sfałszuje wiadomości MLS.
message CallSignalBody {
  enum Kind {
    KIND_UNSPECIFIED = 0;
    OFFER = 1;
    ANSWER = 2;
    ICE_CANDIDATE = 3;
    HANGUP = 4;
  }
  Kind kind = 1;
  bytes call_id = 2;
  string payload = 3;          // SDP albo kandydat ICE
  string dtls_fingerprint = 4; // weryfikowany przed zestawieniem połączenia

  // Adresat sygnału.
  //
  // Wiadomości MLS trafiają do CAŁEJ grupy, a w rozmowie mesh każda para
  // uczestników negocjuje osobne połączenie. Bez adresata trzecia osoba
  // próbowałaby przetworzyć ofertę przeznaczoną dla kogoś innego.
  //
  // Puste = sygnał dla wszystkich (rozmowa dwuosobowa, zaproszenie do grupowej).
  string target = 5;
}
