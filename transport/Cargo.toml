[package]
name = "mekamb-transport"
description = "Transport P2P komunikatora mekamb-chat (iroh QUIC)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

# Transport jest osobnym crate'em, a nie modułem w `core`, z dwóch powodów.
#
# 1. `core` buduje się pod wasm32 bez żadnego toolchainu C. iroh ciągnie `ring`,
#    który wymaga clanga potrafiącego celować w wasm32 — trzymanie tego poza
#    rdzeniem sprawia, że warstwa kryptograficzna pozostaje trywialnie
#    przenośna, a wymagania budowania rosną tylko tam, gdzie faktycznie trzeba.
# 2. Kryptografia i sieć to osobne odpowiedzialności. Kod, który potrzebuje
#    wyłącznie MLS (np. testy, narzędzia offline), nie powinien wciągać całego
#    stosu QUIC.

[dependencies]
mekamb-core = { path = "../core" }
iroh.workspace = true
prost.workspace = true
thiserror.workspace = true
tracing.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# Odwzorowanie portów (PCP/NAT-PMP/UPnP) zwiększa szansę na połączenie
# bezpośrednie. W przeglądarce nie ma do tego dostępu, więc tylko natywnie.
iroh = { workspace = true, features = ["portmapper"] }

[dev-dependencies]
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"] }
